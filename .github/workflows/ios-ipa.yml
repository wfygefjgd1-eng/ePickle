name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-ipa.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Build iOS release (device, no codesign)
        working-directory: mobile
        run: |
          set -euo pipefail
          rm -rf build/ios
          echo "Generating iOS build files..."
          flutter build ios --release --no-codesign 2>&1 | tee flutter_build.log

          echo "Checking if build succeeded despite warning..."
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "✅ Flutter build succeeded"
            ls -la build/ios/iphoneos/Runner.app
            exit 0
          fi

          echo "Flutter build did not create Runner.app, checking error..."
          if grep -q "Development Team" flutter_build.log; then
            echo "⚠️  Development Team error detected, this is expected"
            echo "Checking if build files were generated..."

            if [ -d "ios/.symlinks/flutter/ios-release" ] || [ -d "build/ios/Release-iphoneos" ]; then
              echo "✅ Build files exist, continuing with manual xcodebuild"

              cd ios
              xcodebuild -workspace Runner.xcworkspace \
                -scheme Runner \
                -configuration Release \
                -sdk iphoneos \
                -destination 'generic/platform=iOS' \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" \
                DEVELOPMENT_TEAM="" \
                PROVISIONING_PROFILE="" \
                build

              cd ..
            fi
          fi

          # Final verification
          if [ ! -d "build/ios/iphoneos/Runner.app" ] && [ ! -d "build/ios/Release-iphoneos/Runner.app" ]; then
            echo "❌ Failed to create Runner.app"
            echo "Searching for Runner.app..."
            find build -name "Runner.app" -type d 2>/dev/null || echo "No Runner.app found"
            exit 1
          fi

          # Copy to expected location if in different directory
          if [ -d "build/ios/Release-iphoneos/Runner.app" ] && [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            mkdir -p build/ios/iphoneos
            cp -r build/ios/Release-iphoneos/Runner.app build/ios/iphoneos/
          fi

          echo "✅ Build complete"
          ls -la build/ios/iphoneos/Runner.app

      - name: Package sideload IPA (unsigned)
        working-directory: mobile
        run: |
          set -euo pipefail
          SRC="build/ios/iphoneos/Runner.app"
          test -d "$SRC"
          test -f "$SRC/Runner"
          test -f "$SRC/Info.plist"

          STAGE="/tmp/epickle_ipa_stage_$$"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"

          /usr/bin/ditto -V --norsrc --noextattr --noqtn "$SRC" "$STAGE/Payload/Runner.app"
          find "$STAGE/Payload/Runner.app" -type l -print0 | while IFS= read -r -d '' link; do
            target=$(readlink "$link" || true)
            if [ -n "$target" ]; then
              dir=$(dirname "$link")
              if [ -e "$dir/$target" ]; then
                rm -f "$link"
                /usr/bin/ditto "$dir/$target" "$link"
              elif [ -e "$target" ]; then
                rm -f "$link"
                /usr/bin/ditto "$target" "$link"
              else
                echo "WARN dangling symlink: $link -> $target"
                rm -f "$link"
              fi
            fi
          done

          APP="$STAGE/Payload/Runner.app"
          xattr -cr "$APP" || true
          chmod +x "$APP/Runner" || true
          [ -f "$APP/Frameworks/Flutter.framework/Flutter" ] && chmod +x "$APP/Frameworks/Flutter.framework/Flutter"
          [ -f "$APP/Frameworks/App.framework/App" ] && chmod +x "$APP/Frameworks/App.framework/App"

          thin_arm64() {
            local bin="$1"
            [ -f "$bin" ] || return 0
            local info
            info=$(lipo -info "$bin" 2>/dev/null || true)
            echo "lipo $bin : $info"
            if echo "$info" | grep -q "Architectures in the fat file" && echo "$info" | grep -q arm64; then
              lipo -thin arm64 "$bin" -output "${bin}.thin"
              mv "${bin}.thin" "$bin"
              chmod +x "$bin"
            fi
          }
          thin_arm64 "$APP/Runner"
          thin_arm64 "$APP/Frameworks/Flutter.framework/Flutter"
          thin_arm64 "$APP/Frameworks/App.framework/App"
          find "$APP/Frameworks" -type f \( -name "*.dylib" -o -perm -111 \) 2>/dev/null | while read -r f; do
            thin_arm64 "$f" || true
          done

          if find "$APP" -type l | grep -q .; then
            echo "ERROR: symlinks still present:"
            find "$APP" -type l
            exit 1
          fi

          IPA_OUT="/tmp/ePickle-iOS.ipa"
          rm -f "$IPA_OUT"
          python3 <<PY
          import os, zipfile
          stage = "$STAGE"
          ipa = "/tmp/ePickle-iOS.ipa"
          root = os.path.join(stage, "Payload")
          assert os.path.isdir(root)
          with zipfile.ZipFile(ipa, "w", compression=zipfile.ZIP_DEFLATED, allowZip64=True) as zf:
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames.sort()
                  filenames.sort()
                  rel_dir = os.path.relpath(dirpath, stage).replace("\\\\", "/")
                  if rel_dir == ".":
                      rel_dir = ""
                  if rel_dir:
                      entry = rel_dir.replace("\\\\", "/").rstrip("/") + "/"
                      zinfo = zipfile.ZipInfo(entry)
                      zinfo.external_attr = (0o755 << 16) | 0x10
                      zf.writestr(zinfo, b"")
                  for name in filenames:
                      full = os.path.join(dirpath, name)
                      arc = os.path.relpath(full, stage).replace("\\\\", "/")
                      if os.path.islink(full):
                          print("skip link", full)
                          continue
                      zinfo = zipfile.ZipInfo.from_file(full, arc)
                      if os.access(full, os.X_OK) or name in ("Runner", "Flutter", "App") or name.endswith(".dylib"):
                          zinfo.external_attr = (0o755 << 16)
                      else:
                          zinfo.external_attr = (0o644 << 16)
                      zinfo.compress_type = zipfile.ZIP_DEFLATED
                      with open(full, "rb") as f:
                          zf.writestr(zinfo, f.read())
          print("wrote", ipa, os.path.getsize(ipa))
          PY

          ls -lh /tmp/ePickle-iOS.ipa
          file /tmp/ePickle-iOS.ipa

          python3 <<'PY'
          import zipfile, os
          p = "/tmp/ePickle-iOS.ipa"
          assert os.path.getsize(p) > 3_000_000
          with open(p, "rb") as f:
              assert f.read(2) == b"PK"
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              assert bad is None, f"bad crc: {bad}"
              names = z.namelist()
          print("entries", len(names))
          assert "Payload/Runner.app/Info.plist" in names
          assert "Payload/Runner.app/Runner" in names
          tops = {n.split("/")[0] for n in names if n}
          assert tops == {"Payload"}, tops
          print("ZIP testzip OK")
          PY

          mkdir -p build/ipa_dist
          cp -f /tmp/ePickle-iOS.ipa build/ipa_dist/ePickle-iOS.ipa
          python3 - <<'PY'
          import os, hashlib
          p = "build/ipa_dist/ePickle-iOS.ipa"
          h = hashlib.sha256(open(p,"rb").read()).hexdigest()
          open("build/ipa_dist/SHA256.txt","w").write(h + "  ePickle-iOS.ipa\n")
          print(h, os.path.getsize(p))
          PY
          ls -la build/ipa_dist/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ePickle-iOS
          path: |
            mobile/build/ipa_dist/ePickle-iOS.ipa
            mobile/build/ipa_dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: ePickle-iOS
          path: artifacts

      - name: Resolve release version
        id: meta
        run: |
          set -euo pipefail
          VER=$(grep '^version:' mobile/pubspec.yaml | head -1 | sed 's/version: //;s/+.*//')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          find artifacts -type f -ls

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.meta.outputs.version }}"
          TITLE="v${{ steps.meta.outputs.version }} - ePickle iOS"
          IPA=$(find artifacts -name '*.ipa' | head -1)
          SHA=$(find artifacts -name 'SHA256.txt' | head -1)
          test -f "$IPA"
          test -f "$SHA"

          NOTES=$(cat <<EOF
          iOS sideload build for $TAG.

          Assets:
          - $(basename "$IPA")
          - $(basename "$SHA")
          EOF
          )

          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES"
          else
            gh release edit "$TAG" --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

          gh release upload "$TAG" "$IPA" "$SHA" \
            --repo "${{ github.repository }}" \
            --clobber

      # Do NOT publish a GitHub Release here.
      # Hardcoded "v1.7.7 侧载版" used to steal the "Latest" badge from real
      # version tags (v1.9.x). Full APK+IPA releases are created only by
      # release-build.yml on tags matching v*.
      # Artifacts above are enough for ad-hoc download from Actions.
