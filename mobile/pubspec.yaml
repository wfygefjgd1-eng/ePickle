name: epickle
description: ePickle — multi-source video player for Android/iOS sideload
publish_to: "none"
version: 2.8.0+282

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  html: ^0.15.5
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  wakelock_plus: 1.6.1
  provider: ^6.1.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  sensors_plus: ^6.1.1
  package_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
